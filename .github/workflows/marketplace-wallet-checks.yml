      - 'docs/marketplace-currency-design.md'
      - 'docs/marketplace-api-reference.md'
      - 'Dockerfile'
      - '.dockerignore'
      - 'default/**'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'public/lib.js'
      - 'webpack.config.js'
      - 'scripts/check-marketplace-syntax.mjs'
      - 'scripts/export-marketplace-api-reference.mjs'
      - 'scripts/export-marketplace-snapshot.mjs'
      - 'scripts/run-marketplace-e2e.mjs'
      - 'scripts/seed-marketplace-demo.mjs'
      - 'scripts/smoke-hosted-container.mjs'
      - 'scripts/smoke-marketplace-runtime.mjs'
      - 'server.js'
      - 'src/character-card-parser.js'
      - 'src/command-line.js'
      - 'src/config-init.js'
      - 'src/constants.js'
      - 'src/endpoints/market.js'
      - 'src/endpoints/wallet.js'
      - 'src/healthcheck.js'
      - 'src/middleware/webpack-serve.js'
      - 'src/server-directory.js'
      - 'src/server-main.js'
      - 'src/server-startup.js'
      - 'src/users.js'
      - 'src/util.js'
      - 'src/validator/TavernCardValidator.js'
      - 'public/manifest.json'
      - 'public/index.html'
      - 'public/login.html'
      - 'public/style.css'
      - 'public/css/st-tailwind.css'
      - 'public/css/mobile-styles.css'
      - 'public/css/login.css'
      - 'public/favicon.ico'
      - 'public/img/apple-icon-192x192.png'
      - 'public/img/apple-icon-512x512.png'
      - 'public/service-worker.js'
      - 'public/script.js'
      - 'public/scripts/extensions.js'
      - 'public/scripts/popup.js'
      - 'public/scripts/pwa.js'
      - 'public/scripts/user.js'
      - 'public/scripts/utils.js'
      - 'public/scripts/extensions/marketplace-wallet/**'
      - 'tests/market-wallet.test.js'
      - 'tests/marketplace-wallet-filters.test.js'
      - 'tests/marketplace-wallet-ui.test.js'
      - 'tests/marketplace-demo-seed.test.js'
      - 'tests/marketplace-api-reference.test.js'
      - 'tests/marketplace-scripts.test.js'
      - 'tests/marketplace-snapshot-export.test.js'
      - 'tests/marketplace-wallet.e2e.js'
      - 'tests/playwright.config.js'
      - 'tests/pwa.test.js'
      - 'tests/health.test.js'
      - 'tests/package.json'
      - 'tests/package-lock.json'
  push:
    branches:
      - codex/**
    paths:
      - '.github/workflows/marketplace-wallet-checks.yml'
      - 'README.md'
      - 'docs/marketplace-currency-design.md'
      - 'docs/marketplace-api-reference.md'
      - 'Dockerfile'
      - '.dockerignore'
      - 'default/**'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'public/lib.js'
      - 'webpack.config.js'
      - 'scripts/check-marketplace-syntax.mjs'
      - 'scripts/export-marketplace-api-reference.mjs'
      - 'scripts/export-marketplace-snapshot.mjs'
      - 'scripts/run-marketplace-e2e.mjs'
      - 'scripts/seed-marketplace-demo.mjs'
      - 'scripts/smoke-hosted-container.mjs'
      - 'scripts/smoke-marketplace-runtime.mjs'
      - 'server.js'
      - 'src/character-card-parser.js'
      - 'src/command-line.js'
      - 'src/config-init.js'
      - 'src/constants.js'
      - 'src/endpoints/market.js'
      - 'src/endpoints/wallet.js'
      - 'src/healthcheck.js'
      - 'src/middleware/webpack-serve.js'
      - 'src/server-directory.js'
      - 'src/server-main.js'
      - 'src/server-startup.js'
      - 'src/users.js'
      - 'src/util.js'
      - 'src/validator/TavernCardValidator.js'
      - 'public/manifest.json'
      - 'public/index.html'
      - 'public/login.html'
      - 'public/style.css'
      - 'public/css/st-tailwind.css'
      - 'public/css/mobile-styles.css'
      - 'public/css/login.css'
      - 'public/favicon.ico'
      - 'public/img/apple-icon-192x192.png'
      - 'public/img/apple-icon-512x512.png'
      - 'public/service-worker.js'
      - 'public/script.js'
      - 'public/scripts/extensions.js'
      - 'public/scripts/popup.js'
      - 'public/scripts/pwa.js'
      - 'public/scripts/user.js'
      - 'public/scripts/utils.js'
      - 'public/scripts/extensions/marketplace-wallet/**'
      - 'tests/market-wallet.test.js'
      - 'tests/marketplace-wallet-filters.test.js'
      - 'tests/marketplace-wallet-ui.test.js'
      - 'tests/marketplace-demo-seed.test.js'
      - 'tests/marketplace-api-reference.test.js'
      - 'tests/marketplace-scripts.test.js'
      - 'tests/marketplace-snapshot-export.test.js'
      - 'tests/marketplace-wallet.e2e.js'
      - 'tests/playwright.config.js'
      - 'tests/pwa.test.js'
      - 'tests/health.test.js'
      - 'tests/package.json'
      - 'tests/package-lock.json'

permissions:
  contents: read

jobs:
  marketplace-wallet:
    name: Marketplace Wallet MVP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests

      - name: Run marketplace syntax gate
        run: npm run test:marketplace:syntax

      - name: Run marketplace unit and contract tests
        run: npm run test:marketplace

      - name: Run marketplace runtime smoke
        run: npm run test:marketplace:smoke

      - name: Run hosted Docker smoke
        timeout-minutes: 10
        run: npm run test:hosted:docker

      - name: Verify runner Chrome
        run: google-chrome --version

      - name: Run marketplace browser E2E
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:marketplace:e2e:server
